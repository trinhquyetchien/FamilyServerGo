name: Build & Release Linux App (Go)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux Native Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Build Linux amd64 Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o family-remote-linux-amd64 .
          chmod +x family-remote-linux-amd64

      - name: Package Release Tarball
        run: |
          mkdir -p release-pkg
          cp family-remote-linux-amd64 release-pkg/family-remote
          cp icon.svg release-pkg/icon.svg
          cp linux/desktop/family-remote.desktop release-pkg/family-remote.desktop
          cp README.md release-pkg/README.md
          tar -czvf family-remote-linux-amd64.tar.gz -C release-pkg .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-remote-linux-amd64
          path: family-remote-linux-amd64
          retention-days: 14

      - name: Upload Tarball Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-remote-linux-package
          path: family-remote-linux-amd64.tar.gz
          retention-days: 14

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            family-remote-linux-amd64
            family-remote-linux-amd64.tar.gz
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
